<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" width="320" height="110">
  <defs>
    <filter id="shadow-rect" x="-10%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Outer rect base with shadow -->
  <rect x="15" y="10" width="290" height="84" rx="9" fill="#133863" filter="url(#shadow-rect)" />
  <!-- Inner white frame -->
  <rect x="23" y="18" width="274" height="68" rx="4" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
  <!-- Text in Hebrew -->
  <text x="160" y="62" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="500" text-anchor="middle" direction="rtl">התחל מחדש</text>
</svg>